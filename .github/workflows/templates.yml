name: Templates

on:
  push:
    branches:
      - main
      - 'features/**'
    tags:
      - '*'
    paths-ignore:
      - README.md
      - .gitignore
      - 'docs/**'
  pull_request:
    branches:
      - main

concurrency:
  group: templates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  Build_Configuration: Release
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  MinVerDefaultPreReleaseIdentifiers: preview.0
  NUGET_PUSH: ${{ vars.NUGET_PUSH || 'false' }}
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  NUGET_DIRECTORY: ${{ github.workspace }}/artifacts/packages
  PUBLISHABLE_BRANCHES: main

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calculate.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        run: |
          # Work around https://github.com/dotnet/sdk/issues/53783 on fresh runners.
          if ! dotnet tool restore; then
            echo "::warning::Initial tool restore failed; retrying with the populated resolver cache."
            dotnet tool restore
          fi

      - name: Calculate version
        id: calculate
        run: |
          version="$(dotnet minver -v d)"

          if [[ "${GITHUB_REF}" == "refs/heads/main" && "${version}" != *preview* ]]; then
            version="${version}-preview"
          fi

          echo "Version: ${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          {
            echo "## Template package"
            echo ""
            echo "Version: \`${version}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: Validate and package templates
    needs: version
    runs-on: ubuntu-latest
    env:
      BUILD_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Inspect environment
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore bITdevKit.Examples.GettingStarted.slnx --verbosity normal

      - name: Build solution
        run: >-
          dotnet build bITdevKit.Examples.GettingStarted.slnx
          --configuration ${{ env.Build_Configuration }}
          --no-restore
          --nologo
          /p:UseSharedCompilation=false

      - name: Validate template configuration
        run: |
          mapfile -d '' templates < <(find . -name template.json -type f -print0)

          if [[ "${#templates[@]}" -eq 0 ]]; then
            echo "::error::No template.json files found."
            exit 1
          fi

          for template in "${templates[@]}"; do
            echo "Validating ${template}"
            python3 -m json.tool "${template}" > /dev/null
          done

      - name: Install and create templates
        run: |
          dotnet new install .
          dotnet new list bdksolution
          dotnet new list bdkmodule

          output_directory="${RUNNER_TEMP}/template-test/test-solution"
          dotnet new bdksolution \
            --output "${output_directory}" \
            --SolutionName TestSolution \
            --ModuleName Core \
            --allow-scripts yes

          test -d "${output_directory}/src"
          test -d "${output_directory}/src/Modules/Core"
          test -d "${output_directory}/src/Presentation.Web.Server"

      - name: Restore template package
        run: dotnet restore bITdevKit.Templates.csproj --verbosity minimal

      - name: Package evaluation (nuget)
        id: publishing
        run: |
          is_publishable=false
          should_push=false

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            is_publishable=true
          else
            IFS=',' read -ra publishable_branches <<< "${PUBLISHABLE_BRANCHES}"

            for branch in "${publishable_branches[@]}"; do
              if [[ "${GITHUB_REF_NAME}" == "${branch}" ]]; then
                is_publishable=true
                break
              fi
            done
          fi

          if [[ "${NUGET_PUSH,,}" == "true" ]]; then
            should_push=true
          fi

          echo "is_publishable=${is_publishable}" >> "${GITHUB_OUTPUT}"
          echo "should_push=${should_push}" >> "${GITHUB_OUTPUT}"
          echo "Publishable branch: ${is_publishable}"
          echo "NuGet push enabled: ${should_push}"

          {
            echo "## Package publishing"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Ref | \`${GITHUB_REF_NAME}\` |"
            echo "| Ref type | \`${GITHUB_REF_TYPE}\` |"
            echo "| Publishable ref | \`${is_publishable}\` |"
            echo "| NuGet push enabled | \`${should_push}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Package pack (nuget)
        run: |
          mkdir -p "${NUGET_DIRECTORY}"
          dotnet pack bITdevKit.Templates.csproj \
            --configuration ${{ env.Build_Configuration }} \
            --no-build \
            --nologo \
            --include-symbols \
            --output "${NUGET_DIRECTORY}" \
            --verbosity normal \
            -p:Version="${BUILD_VERSION}" \
            -p:PackageVersion="${BUILD_VERSION}"

          mapfile -t packages < <(find "${NUGET_DIRECTORY}" -maxdepth 1 -name '*.nupkg' -type f | sort)

          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "::error::No NuGet packages were created."
            exit 1
          fi

          {
            echo ""
            echo "### Packages created"
            echo ""
            echo "Packages created: ${#packages[@]}"
            echo ""
            echo "| Package |"
            echo "| --- |"

            for package in "${packages[@]}"; do
              echo "| \`$(basename "${package}")\` |"
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Package push (nuget)
        if: ${{ success() && steps.publishing.outputs.is_publishable == 'true' && steps.publishing.outputs.should_push == 'true' }}
        env:
          API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [[ -z "${API_KEY}" ]]; then
            echo "::error::NUGET_API_KEY secret is not set."
            exit 1
          fi

          {
            echo ""
            echo "### Packages pushed"
            echo ""
            echo "| Package | Result |"
            echo "| --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"

          for package in "${NUGET_DIRECTORY}"/*.nupkg; do
            echo "Publishing package: ${package}"
            if dotnet nuget push "${package}" --source "${NUGET_SOURCE}" --api-key "${API_KEY}" --skip-duplicate; then
              echo "| \`$(basename "${package}")\` | Pushed |" >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "| \`$(basename "${package}")\` | Failed |" >> "${GITHUB_STEP_SUMMARY}"
              exit 1
            fi
          done

      - name: Publish package artifacts
        if: ${{ success() && steps.publishing.outputs.is_publishable == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NuGet packages
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.NUGET_DIRECTORY }}/*.nupkg

      - name: Uninstall templates
        if: always()
        continue-on-error: true
        run: |
          dotnet new uninstall BridgingIT.DevKit.Templates || true
          dotnet new uninstall BridgingIT.DevKit.Solution.Template || true
          dotnet new uninstall . || true